name: CI/CD

# CI: every push and pull request runs the tests (pytest, with ffmpeg; no GPU: fake models).
# CD: only a manual run (Actions -> CI/CD -> Run workflow, any branch) deploys that commit to the API / GPU host
# (/home/ai-trns/app) and restarts the API and the workers -- docs/ARCHITECTURE.md, "Деплой".
# The host is on an internal network: SSH goes through a jump host. Both come from the repo's secrets:
# DEPLOY_HOST, DEPLOY_JUMP_HOST, DEPLOY_KNOWN_HOSTS (ssh-keyscan lines of both), DEPLOY_SSH_KEY.
# Python packages are not installed by the deploy: a change of requirements*.txt is installed by hand.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even while a job is running (a live broadcast is cut, other jobs are retried)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      # the API's packages + what the tests import of the worker's (faster-whisper on CPU, numpy, scipy);
      # torch / pyannote (requirements-diarize.txt) are not needed: the diarize tests use fakes
      - run: pip install -r requirements-api.txt faster-whisper numpy scipy pytest httpx

      - run: python -m pytest -q tests

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      HOST: deploy
      APP: /home/ai-trns/app
      SERVICES: ai-trns-api ai-trns-worker ai-trns-diarize-worker ai-trns-live-worker
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          JUMP_HOST: ${{ secrets.DEPLOY_JUMP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' \
            "Host jump" "  HostName $JUMP_HOST" "  User root" "  IdentityFile ~/.ssh/id_deploy" "  IdentitiesOnly yes" \
            "  LogLevel ERROR" \
            "Host deploy" "  HostName $DEPLOY_HOST" "  User root" "  IdentityFile ~/.ssh/id_deploy" "  IdentitiesOnly yes" \
            "  ProxyJump jump" "  LogLevel ERROR" > ~/.ssh/config

      - name: No job running
        if: ${{ !inputs.force }}
        run: |
          busy=$(ssh "$HOST" 'curl -sf localhost:8766/health' | python3 -c '
          import json, sys
          h = json.load(sys.stdin)
          busy = [w + ": " + s["job"] for w, s in h["workers"].items() if s.get("job")]
          print(", ".join(busy))')
          if [ -n "$busy" ]; then
            echo "::error::jobs are running ($busy); wait, or run again with force"
            exit 1
          fi

      - name: Deploy
        run: |
          mkdir -p out
          git archive HEAD | tar -x -C out
          ts=$(date +%Y%m%d%H%M%S)
          # a backup of the running code; the last 5 of the deploy's own are kept
          ssh "$HOST" "cp -a $APP $APP.bak.ci.$ts && ls -d $APP.bak.ci.* | sort | head -n -5 | xargs -r rm -rf"
          rsync -a --delete --exclude __pycache__ out/ "$HOST:$APP/"
          ssh "$HOST" "echo '${{ github.sha }} ${{ github.ref_name }}' > $APP/DEPLOYED && chown -R ai-trns: $APP && systemctl restart $SERVICES"

      - name: Check
        run: |
          sleep 10
          ssh "$HOST" "systemctl is-active $SERVICES && curl -sf localhost:8766/health"
